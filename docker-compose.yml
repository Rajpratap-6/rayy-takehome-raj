services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      # Initiates the single-node replica set on first run, then reports healthy.
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: rayy_exercise
      GATEWAY_WEBHOOK_SECRET: whsec_local_dev_only
    ports:
      - "8000:8000"
    volumes:
      - .:/app
